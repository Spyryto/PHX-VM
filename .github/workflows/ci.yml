name: PHX-VM tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax validation
        run: find src examples tests bench -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php tests/run.php
      - name: Differential tests T0 vs T1
        run: php tests/t1.php
      - name: T1 superinstruction differential tests
        run: php tests/fusion.php
      - name: T2 direct PHP differential tests
        run: php tests/t2.php
      - name: T2 direct CALL/TAILCALL and recursion differential tests
        run: php tests/t2-calls.php
      - name: T2 leaf inlining differential tests
        run: php tests/inlining.php
      - name: T2 live-register continuation differential suite
        run: php tests/liveness.php
      - name: T0 profiler and tiering advisory differential tests
        run: php tests/tiering.php
      - name: T2 persistent compiled artifact cache correctness
        run: php tests/cache.php
      - name: AdaptiveVm T0-to-T2 differential and fallback tests
        run: php tests/adaptive.php
      - name: Example smoke test
        run: php examples/sum-tail.php 10000
      - name: Benchmark smoke (no speed threshold)
        run: php bench/compare.php 5000
      - name: Inlining benchmark smoke (no speed threshold)
        run: php bench/inline.php 1000
      - name: Live-register frame benchmark smoke (no speed threshold)
        run: php bench/frames.php 250
      - name: Call and recursion benchmark smoke (no speed threshold)
        run: php bench/calls.php 1000
      - name: Tiering calibration demo (no speed threshold)
        run: php bench/tiering.php 400 30
      - name: T2 persistent-cache benchmark smoke (no speed threshold)
        run: php bench/cache.php 250 3
      - name: End-to-end compile/write/load/execute benchmark (no speed threshold)
        run: php bench/end-to-end.php 400 3
      - name: End-to-end JSON report contract
        shell: bash
        run: |
          set -euo pipefail
          php bench/end-to-end.php 120 2 --json > "$RUNNER_TEMP/phx-vm-e2e-report.json"
          php -r '$r = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); if (count($r["measurements"]) !== 3 || !isset($r["environment"]["php"])) exit(1); foreach ($r["measurements"] as $m) { if ($m["originalInstructions"] < 1 || $m["t2ColdTotalMedianMs"] <= 0) exit(1); }' "$RUNNER_TEMP/phx-vm-e2e-report.json"
      - name: OPcache stable artifacts across two CLI processes (no speed threshold)
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/phx-vm-e2e-artifacts"
          file_cache="$RUNNER_TEMP/phx-vm-opcache-filecache"
          mkdir -p "$artifacts" "$file_cache"
          php -d opcache.enable_cli=1 -d opcache.file_cache="$file_cache" -d opcache.file_update_protection=0 bench/end-to-end.php 400 3 "$artifacts"
          php -d opcache.enable_cli=1 -d opcache.file_cache="$file_cache" -d opcache.file_update_protection=0 bench/end-to-end.php 400 3 "$artifacts" | tee "$RUNNER_TEMP/phx-e2e-second-run.log"
          test "$(grep -c 'Stable artifact: reused' "$RUNNER_TEMP/phx-e2e-second-run.log")" -eq 3
          test "$(find "$artifacts" -maxdepth 1 -type f -name 'phx-*.php' | wc -l)" -eq 3
      - name: T2 compiled artifact cache concurrent-process smoke
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/phx-cache-race"
          mkdir -m 700 -p "$artifacts"
          pids=()
          for i in 1 2 3 4 5 6; do
            php tests/cache-worker.php "$artifacts" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
          test "$(find "$artifacts" -maxdepth 1 -type f -name 'phx-*.php' | wc -l)" -eq 1
          test "$(find "$artifacts" -maxdepth 1 -type f -name 'phx-*.meta.json' | wc -l)" -eq 1
          php tests/cache-worker.php "$artifacts"
